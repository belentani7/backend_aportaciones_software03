name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ecosystem/backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r ecosystem/backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q ecosystem/backend/app
      - name: Run integration tests
        env:
          PYTHONPATH: ecosystem/backend
        run: pytest -q ecosystem/tests
      - name: Validate compose structure
        run: |
          python - <<'PY'
          from pathlib import Path
          content = Path('docker-compose.yml').read_text(encoding='utf-8')
          required = ['gateway:', 'api:', 'worker:', 'scheduler:', 'postgres:', 'redis:', 'core:', 'internal: true']
          missing = [value for value in required if value not in content]
          if missing:
              raise SystemExit(f'Missing compose sections: {missing}')
          PY
